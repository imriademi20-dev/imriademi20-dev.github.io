<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia e Shitjeve - Bookstore</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>📊 Historia e Shitjeve</h3>
            <input type="date" id="filterDate" class="form-control d-inline-block me-2" style="width: 180px;" onchange="filterSalesByDate()">
        <button class="btn btn-danger my-2" onclick="exportSalesToPDF()">📄 Eksporto në PDF</button>
        <button class="btn btn-outline-primary me-2" onclick="exportToCSV()">📤 Eksporto në CSV</button>
        <button class="btn btn-outline-danger me-2" onclick="clearSalesHistory()">🧹 Fshi Historinë</button> 
        <button class="btn btn-secondary" onclick="backToSellerDashboard()">⬅️ Kthehu</button>
    </div>

    <div class="card shadow">
      <div class="card-body">
        <table class="table table-striped">
          <thead class="table-dark">
            <tr>
              <th>Data/Ora</th>
              <th>Titulli</th>
              <th>Autori</th>
              <th>Viti</th>
              <th>Sasia</th>
              <th>Çmimi</th>
              <th>Totali</th>
            </tr>
          </thead>
          <tbody id="salesHistoryTable">
            
          </tbody>
        </table>
        <div class="mt-3">
            <h5 id="summaryInfo">📦 Totali i Shitur: 0 libra | 💰 Të Ardhurat Totale: 0.00€</h5>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
