<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrata - Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-light bg-white border-bottom mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h4 class="m-0">📚 Administrata</h4>
            <br><br>
            <button class="btn btn-outline-primary me-2" onclick="goToRegisterUser()">Regjistro Përdorues</button>
            <button class="btn btn-outline-danger" onclick="logOff()">Dil</button>
            
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="text-center mb-4">Menaxhimi i Librave</h2>

        <!-- Forma per Add te libres -->
         <div class="card mb-4 shadow">
            <div class="card-body">
                <h5>Shto një Libër</h5>
                <div class="row g-3">
                    <div class="col-md-4"><input type="text" id="title" class="form-control" placeholder="Titulli"></div>
                    <div class="col-md-4"><input type="text" id="author" class="form-control" placeholder="Autori"></div>
                    <div class="col-md-2"><input type="number" id="year" class="form-control" placeholder="Viti"></div>
                    <div class="col-md-2"><input type="number" id="quantity" class="form-control" placeholder="Sasia"></div>
                    <div class="col-md-2"><input type="number" id="price" class="form-control" placeholder="Çmimi"></div>
                </div>
                <button class="btn btn-success mt-3" onclick="addBook()">Shto Librin</button>
            </div>
         </div>

        <!-- tabela e librave -->

        <div class="card shadow">
            <h5>-- Lista e Librave --</h5>
            <table class="table table-bordered" id="bookTable">
                <thead class="table-dark">
                    <tr>
                        <th>Titulli</th>
                        <th>Autori</th>
                        <th>Viti</th>
                        <th>Sasia</th>
                        <th>Çmimi</th>
                        <th>Veprime</th>
                    </tr>
                </thead>
                <tbody id="bookList">
                    
                </tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
