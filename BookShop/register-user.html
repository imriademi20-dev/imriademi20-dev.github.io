<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register User - Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">
    <div class="container d-flex flex-column justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow w-100" style="max-width: 400px;">
            <h4 class="text-center mb-3">Regjistro Përdorues të Ri</h4>
            <div class="form-group mb-3">
                <input type="text" id="newUsername" class="form-control" placeholder="Emri i përdoruesit">
            </div>
            <div class="form-group mb-3">
                <input type="password" id="newPassword" class="form-control" placeholder="Fjalëkalimi">
            </div>
            <button class="btn btn-success w-100" onclick="registerUser()">Regjistro</button>
            <button class="btn btn-secondary w-100 mt-2" onclick="backToDashboard()">Kthehu</button>
        </div>
    </div>
    <script src="js/app.js"></script>

</body>
</html>
