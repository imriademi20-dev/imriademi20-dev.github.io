<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paneli i Shitësit - Bookstore</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>📦 Paneli i Shitësit</h3>
            <button class="btn btn-outline-success me-2" onclick="saveSales()">💾 Ruaj Shitjet</button>
            <button class="btn btn-outline-primary me-2" onclick="goToSalesHistory()">📊 Historia e Shitjeve</button>
            <button class="btn btn-danger" onclick="logOff()">Dil</button>
</button>
        </div>
        <div class="card shadow">
            <div class="card-body">
                <h5>Librat në Dispozicion</h5>
                <div class="alert alert-info" id="salesInfo">
                    Të Ardhurat Totale: 0€
                </div>
                <table class="table table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Titulli</th>
                            <th>Autori</th>
                            <th>Viti</th>
                            <th>Sasia</th>
                            <th>Çmimi</th>
                            <th>Veprime</th>
                        </tr>
                    </thead>
                    <tbody id="bookList">
                       
                
                    </tbody>
                </table>
            </div>
        </div>
        
    </div>

    <script src="js/app.js"></script>
</body>
</html>
