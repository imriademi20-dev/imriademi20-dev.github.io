<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Login - BookStore</title>
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-4 w-100" style="max-width: 400px;">
            <h3 class="text-center mb-4">Hyr në Bookstore</h3>
            <div class="form-group mb-3">
                <input type="text" class="form-control" id="adminUsername" placeholder="Emri i përdoruesit">
            </div>
            <div class="form-group mb-3">
                <input type="password" class="form-control" id="adminPassword" placeholder="Fjalëkalimi">
            </div>
                <button class="btn btn-primary w-100" onclick="adminLogin()">Hyr</button>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
